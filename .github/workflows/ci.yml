name: CI

on:
  push:
    branches: [trunk]
  pull_request:

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CI_RUST_VERSION: "1.94"
  CI_RUST_MSRV: "1.71"

jobs:
  build:
    timeout-minutes: 5

    strategy:
      matrix:
        include:
          # wasm stable
          - name: "stable wasm"
            os: "ubuntu-latest"
            target: "wasm32-unknown-unknown"

          # native stable
          - name: "stable linux"
            os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"

          - name: "stable mac"
            os: "macos-latest"
            target: "x86_64-apple-darwin"

          - name: "stable windows"
            os: "windows-latest"
            target: "x86_64-pc-windows-msvc"

      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        shell: bash
        run: cargo clippy --all-features --target ${{ matrix.target }}

      - name: doc
        shell: bash
        if: matrix.name != 'stable wasm'
        run: cargo doc --no-deps --target ${{ matrix.target }}

      - name: test
        shell: bash
        if: matrix.name != 'stable wasm'
        run: cargo nextest run --all-features --target ${{ matrix.target }}

      - name: doctest
        shell: bash
        if: matrix.name != 'stable wasm'
        run: cargo test --doc --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_MSRV }}

      - uses: Swatinem/rust-cache@v2

      - name: downgrade dependencies
        run: |
          set -e

          # 2.12.0 bumps MSRV to 1.82.
          cargo update -p indexmap --precise 2.11.0

      - name: check msrv
        run: |
          set -e

          cargo check
          cargo check --no-default-features

  cargo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cwfitzgerald/repo-common/.github/actions/install-rust@trunk
        with:
          version: ${{ env.CI_RUST_VERSION }}
          components: rustfmt

      - name: Rustfmt
        run: |
          cargo fmt -- --check

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check
          arguments: --all-features
